spring.application.name=neki-test

spring.datasource.url=jdbc:postgresql://${DB_TEST_HOST:localhost}:${DB_TEST_PORT:5432}/${DB_TEST_NAME:radar_skill_test}
spring.datasource.username=${DB_TEST_USERNAME:postgres}
spring.datasource.password=${DB_TEST_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:database/SistemaSkill.sql
spring.jpa.open-in-view=false

jwt.secret=${JWT_TEST_SECRET:talentario-test-secret-jwt-hs256-2026-32bytes}
jwt.expiration.ms=3600000

app.cors.allowed-origins=http://localhost:5173
