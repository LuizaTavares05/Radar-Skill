spring.application.name=neki

server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:radar_skill}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:talentario-dev-secret-chave-jwt-hs256-2026-32bytes}
jwt.expiration.ms=${JWT_EXPIRATION:86400000}

app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

springdoc.swagger-ui.path=/swagger-ui.html
