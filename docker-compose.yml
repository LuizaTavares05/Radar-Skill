name: radar-skill

services:
  db:
    image: postgres:16-alpine
    container_name: radar-db
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-radar_skill}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./.env:/app/.env
      - pgdata:/var/lib/postgresql/data
      - ./backend/database/SistemaSkill.sql:/docker-entrypoint-initdb.d/01-sistema-skill.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-radar_skill}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: radar-backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-radar_skill}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-radar-skill-dev-secret-chave-jwt-hs256-2026-32bytes}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://localhost:8081,http://localhost:5173,http://localhost:3000}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: radar-frontend
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
