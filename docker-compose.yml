name: radar-skill

services:
  db:
    image: postgres:16-alpine
    container_name: radar-db
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-radar_skill}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/database/SistemaSkill.sql:/docker-entrypoint-initdb.d/01-sistema-skill.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-radar_skill}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: radar-backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-radar_skill}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-radar-skill-dev-secret-chave-jwt-hs256-2026-32bytes}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      APP_CORS_ORIGINS: "http://localhost:${FRONTEND_PORT:-8081},http://${MY_LOCAL_IP:-localhost}:${FRONTEND_PORT:-8081}"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: radar-frontend
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    depends_on:
      - backend
    restart: unless-stopped

  mobile:
    build:
      context: .
      dockerfile: mobile/Dockerfile
    container_name: radar-mobile
    tty: true
    ports:
      - "8082:8082"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    environment:
      - RCT_METRO_PORT=8082
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - REACT_NATIVE_PACKAGER_HOSTNAME=${MY_LOCAL_IP:-localhost}
      - EXPO_PUBLIC_API_URL=http://${MY_LOCAL_IP:-localhost}:${BACKEND_PORT:-8080}
      - CI=false
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata: